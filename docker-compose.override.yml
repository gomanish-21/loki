# Development override file
# This file adds development-specific configurations
# Run with: docker-compose -f docker-compose.yml -f docker-compose.override.yml up

version: "3.8"

services:
  # FastAPI Application (Development)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ENVIRONMENT=development
      - PYTHONPATH=/app
    volumes:
      - .:/app
      - ./logs:/app/logs
    command:
      ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_healthy

  # MongoDB Express (Development - Web UI for MongoDB)
  mongo-express:
    image: mongo-express:1.0.0
    container_name: formatter-mongo-express-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password123
      ME_CONFIG_MONGODB_URL: mongodb://admin:password123@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password123
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - formatter-network
