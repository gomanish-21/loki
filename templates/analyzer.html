<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AI SQL Analyzer</title>
    <link
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <div class="container">
      <header class="header">
        <div class="header-content">
          <div class="header-left">
            <button class="back-btn" onclick="navigateTo('/')">
              <i class="fas fa-arrow-left"></i> Back
            </button>
          </div>
          <div class="header-center">
            <h1><i class="fas fa-search"></i> AI SQL Analyzer</h1>
            <p>Get performance analysis of your SQL queries using AI</p>
          </div>
          <div class="header-right">
          </div>
        </div>
      </header>

      <main class="main-content">
        <div class="formatter-section">
          <div class="controls">
            <button id="analyze-btn" class="primary-btn">
              <i class="fas fa-magic"></i> Analyze
            </button>
          </div>

          <div class="editor-container">
            <div class="input-section">
              <div class="section-header">
                <h3><i class="fas fa-edit"></i> Input SQL</h3>
                <button id="clear-input" class="icon-btn" title="Clear input">
                  <i class="fas fa-trash"></i>
                </button>
              </div>
              <textarea
                id="input-text"
                placeholder="Paste your SQL here to analyze for performance..."
              ></textarea>
            </div>

            <div class="output-section">
              <div class="section-header">
                <h3><i class="fas fa-eye"></i> Analysis</h3>
              </div>
              <pre id="output-text"></pre>
            </div>
          </div>

          <div id="error-message" class="error-message hidden"></div>
        </div>
      </main>
    </div>

    <script src="/static/analyzer.js"></script>
  </body>
</html>
